# Server
server.port=8080

# Security: Force HTTPS in production (uncomment for prod)
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# H2 Database (in-memory for dev, swap to PostgreSQL for prod)
spring.datasource.url=jdbc:h2:mem:weathergptdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console - DISABLED by default (enable only for development)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET:d0m2Hx8bB2r1Tq5cN3v7Kf9Lp4s6Wj8yEa0GbCdEfGhIjKlMnOpQrStUvWxYzA1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0U1V2W3X4Y5Z6}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.token-prefix=Bearer

# Weather Provider (Open-Meteo - free, no API key required)
# Override with environment variables when needed.
weather.api.base-url=${WEATHER_API_BASE_URL:https://api.open-meteo.com/v1}
geocoding.api.base-url=${GEOCODING_API_BASE_URL:https://geocoding-api.open-meteo.com/v1}

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Application URLs
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:noreply@weathergpt.com}
