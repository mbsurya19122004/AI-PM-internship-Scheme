# Server
server.port=8080

# Security: Force HTTPS in production (uncomment for prod)
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# H2 Database (in-memory for dev, swap to PostgreSQL for prod)
spring.datasource.url=jdbc:h2:mem:internshipdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console - DISABLED by default (enable only for development)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.token-prefix=Bearer

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Profile Picture Upload
app.upload.dir=uploads/profile-pictures
app.upload.max-size=5242880
app.upload.allowed-types=image/jpeg,image/png,image/webp

# ML Service
ml.service.url=http://localhost:8000

# Security: Request size limit (protect against large payloads)
server.tomcat.max-http-form-post-size=10MB

# Email Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Application URLs
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:noreply@internshipplatform.com}
